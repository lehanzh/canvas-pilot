[project]
name = "canvas-pilot"
version = "0.1.0"
description = "Local MCP server that turns your Canvas LMS account into an academic assistant for any AI agent"
readme = "README.md"
authors = [
    { name = "Lehan Zhang", email = "196732543+lehanzh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3,<3",
    "python-dotenv>=1.2.4",
    "tzlocal>=5.4.4",
]

[project.scripts]
canvas-pilot = "canvas_pilot:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
